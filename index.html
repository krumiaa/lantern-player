<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lantern">
  <link rel="manifest" href="./site.webmanifest">
  <title>The Lantern Protocol</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; min-height:100vh; background:#111318; color:#f4f1e8; display:grid; place-items:center; }
    main { width:min(92vw,620px); padding:28px 20px 40px; box-sizing:border-box; }
    .eyebrow { opacity:.62; letter-spacing:.14em; font-size:.75rem; text-transform:uppercase; }
    h1 { font-family: Georgia, serif; font-size:2rem; margin:.45rem 0 1.4rem; }
    .card { border:1px solid #343842; border-radius:18px; padding:22px; background:#181b21; box-shadow:0 18px 50px rgba(0,0,0,.28); }
    #episode { opacity:.72; margin-bottom:.35rem; }
    #title { font-family: Georgia, serif; font-size:1.45rem; margin:0 0 1.1rem; }
    audio { width:100%; margin:10px 0 14px; }
    #status { min-height:2.5em; line-height:1.4; opacity:.8; font-size:.92rem; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    button { appearance:none; border:1px solid #454b58; background:#242831; color:#f4f1e8; border-radius:12px; padding:10px 14px; font:inherit; }
    button:active { transform:translateY(1px); }
    .quiet { opacity:.68; font-size:.8rem; margin-top:18px; line-height:1.45; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Private serial audiobook beta</div>
    <h1>The Lantern Protocol</h1>
    <section class="card">
      <div id="episode">Loading…</div>
      <div id="title"></div>
      <audio id="audio" controls preload="metadata"></audio>
      <div id="status"></div>
      <div class="row">
        <button id="tokenButton" type="button">Set GitHub token</button>
        <button id="forgetTokenButton" type="button">Forget token</button>
        <button id="refreshButton" type="button">Refresh</button>
        <button id="retryButton" type="button" hidden>Prepare next episode</button>
      </div>
      <div class="quiet">
        The page contains no story data or GitHub credential. Your token remains in this browser.
        Finishing an episode authorizes exactly one successor. Pausing does not.
      </div>
    </section>
  </main>
  <script src="./app.js?v=2"></script>
</body>
</html>
